<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear Gradients for Text & Borders -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="40%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Ambient Glow Blobs -->
  <circle cx="200" cy="180" r="140" fill="#00F5FF" opacity="0.08" filter="url(#glow-cyan)"/>
  <circle cx="1000" cy="180" r="160" fill="#A855F7" opacity="0.09" filter="url(#glow-purple)"/>

  <!-- Card Outer Border -->
  <rect x="15" y="15" width="1170" height="330" rx="20" fill="none" stroke="url(#border-grad)" stroke-width="1.5"/>

  <!-- Top Decorative Tech Accent -->
  <path d="M 40 15 L 120 15 L 140 28 L 260 28 L 275 15" fill="none" stroke="#00F5FF" stroke-width="2" filter="url(#glow-cyan)"/>
  <circle cx="50" cy="15" r="3" fill="#00F5FF"/>
  <circle cx="265" cy="15" r="3" fill="#00F5FF"/>

  <!-- Center Icon Graphic: High-Tech Cybernetic Daemon Compass -->
  <g transform="translate(140, 180)">
    <!-- Rotating Reticle Rings -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="#1E293B" stroke-width="2"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="10 15"/>
    <circle cx="0" cy="0" r="54" fill="#0F172A" stroke="#00F5FF" stroke-width="2" filter="url(#glow-cyan)"/>
    
    <!-- Radar Sweep Marks -->
    <line x1="-70" y1="0" x2="-54" y2="0" stroke="#00F5FF" stroke-width="2"/>
    <line x1="54" y1="0" x2="70" y2="0" stroke="#00F5FF" stroke-width="2"/>
    <line x1="0" y1="-70" x2="0" y2="-54" stroke="#00F5FF" stroke-width="2"/>
    <line x1="0" y1="54" x2="0" y2="70" stroke="#00F5FF" stroke-width="2"/>

    <!-- Central Lightning & Speed Hexagon -->
    <polygon points="0,-36 31,-18 31,18 0,36 -31,18 -31,-18" fill="#1E1B4B" stroke="#A855F7" stroke-width="2" filter="url(#glow-purple)"/>
    <!-- Lightning Bolt Glyph -->
    <path d="M 3 -22 L -14 0 L -1 0 L -5 22 L 14 -2 L 1 -2 Z" fill="#00F5FF" filter="url(#glow-cyan)"/>
  </g>

  <!-- Typography & Headers -->
  <!-- Top Supertag -->
  <g transform="translate(280, 82)">
    <rect x="0" y="0" width="240" height="26" rx="13" fill="url(#pill-bg)" stroke="#00F5FF" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#00F5FF" filter="url(#glow-cyan)"/>
    <text x="28" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#00F5FF" letter-spacing="2">GOAL-MODE ENGINE v1.0</text>
  </g>

  <!-- Brand Title -->
  <text x="280" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="58" font-weight="900" fill="url(#text-grad)" letter-spacing="-1">
    DEADLINE DAEMON
  </text>

  <!-- Mission Subtitle -->
  <text x="282" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" letter-spacing="0.2">
    Autonomous Milestone Planning, Critical Grill-Me Governance &amp; Codebase Omni-Scanner
  </text>

  <!-- Feature Pill Tags -->
  <g transform="translate(282, 230)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="34" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="14" y="21" font-family="monospace" font-size="12" font-weight="600" fill="#38BDF8">⚡ ZERO-CONTEXT-ROT</text>

    <!-- Pill 2 -->
    <rect x="195" y="0" width="175" height="34" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="209" y="21" font-family="monospace" font-size="12" font-weight="600" fill="#A855F7">🧠 EXECUTIVE TRIAD</text>

    <!-- Pill 3 -->
    <rect x="385" y="0" width="195" height="34" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="399" y="21" font-family="monospace" font-size="12" font-weight="600" fill="#34D399">🔍 PAGERANK REPOMAP</text>

    <!-- Pill 4 -->
    <rect x="595" y="0" width="185" height="34" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="609" y="21" font-family="monospace" font-size="12" font-weight="600" fill="#F43F5E">🛡️ STRICT READ-ONLY</text>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <g transform="translate(40, 310)">
    <text x="0" y="0" font-family="monospace" font-size="12" fill="#64748B">STATUS: </text>
    <text x="60" y="0" font-family="monospace" font-size="12" font-weight="bold" fill="#10B981">CI PASSING [6s]</text>
    <text x="180" y="0" font-family="monospace" font-size="12" fill="#64748B">•</text>
    <text x="200" y="0" font-family="monospace" font-size="12" fill="#64748B">LICENSE: </text>
    <text x="265" y="0" font-family="monospace" font-size="12" font-weight="bold" fill="#00F5FF">MIT</text>
    <text x="300" y="0" font-family="monospace" font-size="12" fill="#64748B">•</text>
    <text x="320" y="0" font-family="monospace" font-size="12" fill="#64748B">NODE: </text>
    <text x="365" y="0" font-family="monospace" font-size="12" font-weight="bold" fill="#FBBF24">22 / 24 / 26</text>
    <text x="470" y="0" font-family="monospace" font-size="12" fill="#64748B">•</text>
    <text x="490" y="0" font-family="monospace" font-size="12" fill="#64748B">AUTONOMY: </text>
    <text x="575" y="0" font-family="monospace" font-size="12" font-weight="bold" fill="#EC4899">ZERO CONTINUATION NUDGES</text>
  </g>
</svg>
