<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="100%">
  <defs>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#050811" rx="16"/>

  <!-- Connecting Pipe Lines -->
  <path d="M 310 190 L 350 190" stroke="#38BDF8" stroke-width="3" stroke-dasharray="6 4"/>
  <polygon points="354,190 346,185 346,195" fill="#38BDF8"/>

  <path d="M 650 190 L 690 190" stroke="#A855F7" stroke-width="3" stroke-dasharray="6 4"/>
  <polygon points="694,190 686,185 686,195" fill="#A855F7"/>

  <!-- STAGE 1: INGESTION & GRILL -->
  <g transform="translate(30, 40)" filter="url(#shadow)">
    <rect width="280" height="300" rx="14" fill="url(#card-grad)" stroke="#1E293B" stroke-width="1.5"/>
    <!-- Card Header Banner -->
    <rect width="280" height="42" rx="14" fill="#00F5FF" fill-opacity="0.08"/>
    <rect x="0" y="40" width="280" height="2" fill="#00F5FF" fill-opacity="0.4"/>
    <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#00F5FF" letter-spacing="1">PHASE 1: GRILL &amp; THRILL</text>

    <!-- Content Items -->
    <text x="20" y="75" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Critical Alignment</text>
    <text x="20" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94A3B8">Challenge logic gaps before code</text>

    <!-- Feature Row 1 -->
    <rect x="20" y="120" width="240" height="42" rx="8" fill="#1E293B" fill-opacity="0.5" stroke="#334155" stroke-width="0.8"/>
    <text x="32" y="145" font-family="monospace" font-size="12" fill="#38BDF8">🎯 project.md Ingestion</text>

    <!-- Feature Row 2 -->
    <rect x="20" y="172" width="240" height="42" rx="8" fill="#1E293B" fill-opacity="0.5" stroke="#334155" stroke-width="0.8"/>
    <text x="32" y="197" font-family="monospace" font-size="12" fill="#F43F5E">🔥 4-Round Executive Grill</text>

    <!-- Feature Row 3 -->
    <rect x="20" y="224" width="240" height="42" rx="8" fill="#1E293B" fill-opacity="0.5" stroke="#334155" stroke-width="0.8"/>
    <text x="32" y="249" font-family="monospace" font-size="12" fill="#A855F7">⚖️ ACH Falsification Grid</text>

    <!-- Bottom Status -->
    <text x="20" y="295" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#64748B">OUTCOME: 100% SPEC CLARITY</text>
  </g>

  <!-- STAGE 2: MILESTONE CONTRACT -->
  <g transform="translate(360, 40)" filter="url(#shadow)">
    <rect width="280" height="300" rx="14" fill="url(#card-grad)" stroke="#1E293B" stroke-width="1.5"/>
    <!-- Card Header Banner -->
    <rect width="280" height="42" rx="14" fill="#A855F7" fill-opacity="0.08"/>
    <rect x="0" y="40" width="280" height="2" fill="#A855F7" fill-opacity="0.4"/>
    <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#A855F7" letter-spacing="1">PHASE 2: DUAL CONTRACT</text>

    <!-- Content Items -->
    <text x="20" y="75" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">CCPM Buffer Science</text>
    <text x="20" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94A3B8">Goldratt variance protection</text>

    <!-- Feature Row 1 -->
    <rect x="20" y="120" width="240" height="42" rx="8" fill="#1E293B" fill-opacity="0.5" stroke="#334155" stroke-width="0.8"/>
    <text x="32" y="145" font-family="monospace" font-size="12" fill="#EC4899">📋 projectdeadline.md</text>

    <!-- Feature Row 2 -->
    <rect x="20" y="172" width="240" height="42" rx="8" fill="#1E293B" fill-opacity="0.5" stroke="#334155" stroke-width="0.8"/>
    <text x="32" y="197" font-family="monospace" font-size="12" fill="#FBBF24">⏱️ 20% Centralized Buffer</text>

    <!-- Feature Row 3 -->
    <rect x="20" y="224" width="240" height="42" rx="8" fill="#1E293B" fill-opacity="0.5" stroke="#334155" stroke-width="0.8"/>
    <text x="32" y="249" font-family="monospace" font-size="12" fill="#34D399">📈 3-Zone Fever Chart</text>

    <!-- Bottom Status -->
    <text x="20" y="295" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#64748B">OUTCOME: ZERO UNCERTAINTY</text>
  </g>

  <!-- STAGE 3: AUTONOMOUS GOAL-MODE EXECUTION -->
  <g transform="translate(690, 40)" filter="url(#shadow)">
    <rect width="280" height="300" rx="14" fill="url(#card-grad)" stroke="#1E293B" stroke-width="1.5"/>
    <!-- Card Header Banner -->
    <rect width="280" height="42" rx="14" fill="#10B981" fill-opacity="0.08"/>
    <rect x="0" y="40" width="280" height="2" fill="#10B981" fill-opacity="0.4"/>
    <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#10B981" letter-spacing="1">PHASE 3: GOAL-MODE EXEC</text>

    <!-- Content Items -->
    <text x="20" y="75" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Hermetic Delivery</text>
    <text x="20" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94A3B8">Zero prompts until verified done</text>

    <!-- Feature Row 1 -->
    <rect x="20" y="120" width="240" height="42" rx="8" fill="#1E293B" fill-opacity="0.5" stroke="#334155" stroke-width="0.8"/>
    <text x="32" y="145" font-family="monospace" font-size="12" fill="#00F5FF">🔍 Omni-Scanner (Read-Only)</text>

    <!-- Feature Row 2 -->
    <rect x="20" y="172" width="240" height="42" rx="8" fill="#1E293B" fill-opacity="0.5" stroke="#334155" stroke-width="0.8"/>
    <text x="32" y="197" font-family="monospace" font-size="12" fill="#10B981">⚡ Native Surgical Diffs</text>

    <!-- Feature Row 3 -->
    <rect x="20" y="224" width="240" height="42" rx="8" fill="#1E293B" fill-opacity="0.5" stroke="#334155" stroke-width="0.8"/>
    <text x="32" y="249" font-family="monospace" font-size="12" fill="#FBBF24">🏁 Turnkey Verification Seal</text>

    <!-- Bottom Status -->
    <text x="20" y="295" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#64748B">OUTCOME: 100% PASSING ON-DEVICE</text>
  </g>
</svg>
